[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent-runner"
version = "1.10.0"
description = "One-shot foreground runner for immutable Codex and Claude Code agent tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.147.0",
  "PyYAML==6.0.3",
]

[project.scripts]
agent-runner = "agent_runner:main"
agent-run-manifest = "run_manifest:main"
agent-projects = "agent_projects:main"

[tool.setuptools]
py-modules = ["agent_runner", "run_manifest", "run_dispatch", "run_chat", "agent_projects", "project_watch"]
