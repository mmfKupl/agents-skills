# Тексты, которые чат проекта показывает разработчику как есть.
# Скрипт подставляет значения в фигурные скобки и печатает готовый текст; чат его не
# сочиняет. Английские тексты и список скобок для каждого: agent-runner/project_messages.py.
# Свой вариант любого текста на одной машине: ~/agent-projects/messages.yaml.
# Проверить файл: agent-projects init, строка messages.
# Оформление пишется здесь же маркдауном, чат показывает его как есть. Что берём:
# **жирный** для того, что глаз должен найти первым, _курсив_ для подсказок, таблица
# для списка тикетов, обычный список, линия --- между частями сообщения.
# Что не берём: галочки (отмеченную приложение рисует серой и зачёркнутой, читать
# невозможно), ~~зачёркнутый~~ текст, цитаты (тускло), плашки [!NOTE] (некрасиво),
# блок кода для текста, сворачиваемый блок (приложение его не рисует).

# Как называется шаг: по скиллу, который он запускает, или по виду отчёта.
# Слово стоит перед «идёт», «в очереди», «: отчёт готов», поэтому в именительном падеже.
steps:
  review-task: ревью
  review: ревью
  brainstorm-task: проработка
  brainstorm: проработка
  develop-task: разработка
  develop-please: разработка
  develop: разработка
  develop-draft: прототип
  draft: прототип

# Раздел отчёта, в котором сказано, чем кончился шаг. Показывается первый найденный.
outcome_sections:
  - Verdict

# Тикет в одну строку. {ticket} — номер, ссылкой, когда адрес известен.
ticket: "{ticket} «{title}»: **{where}**"
ticket_untitled: "{ticket}: **{where}**"
# Та же строка для уведомления на телефон: там маркдаун не показывается.
notify_ticket: "{ticket}: {where}"
step_unknown: "запуск"
# Шаг с парой слов о том, что делает именно этот запуск.
step_about: "{step} ({about})"
where_held: "{step} ждёт твоего слова"
where_waiting: "{step} в очереди"
where_starting: "{step} запускается"
where_checking: "комментарий разбирается"
where_sorting: "проверка решает, что запустить"
where_started: "{step} идёт"
where_failed: "{step}: ошибка"
where_ready: "{step}: отчёт готов"
# То же в списке тикетов: отчёт открывается прямо из строки.
where_ready_link: "{step}: [отчёт готов]({link})"
where_no_report: "{step}: закончено без отчёта"
where_chat: "над ним работает чат: {chats}"
where_nothing: "ничего не запущено"
where_open: "{where}, чат открыт: {chat}"

# Состояние проекта: agent-projects board <проект>.
# Первая строка заголовком: с неё начинается состояние проекта.
board_project: "## Проект `{project}`\n\n**Тикеты:** {covers}."
covers_linear: "проект Linear {name}"
covers_tickets: "тикеты {tickets}"
covers_assignee: "все тикеты, назначенные на тебя"
covers_none: "тикеты пока не названы"
covers_and: " и "
# Показываются только включённые триггеры, таблицей: шапка и одна строка.
board_triggers: "| Включённый триггер | Что делает |\n|---|---|"
trigger_on: "| `{trigger}` | {about} |"
under: "**Триггер `{trigger}`:**"
# Под триггером сейчас ничего нет: одна строка вместо заголовка и списка.
under_none: "**Триггер `{trigger}`:** тикетов нет."
# Список тикетов таблицей: шапка и одна строка. Вместо {ticket}, {title}, {where}
# можно взять {line}, готовую строку о тикете, и убрать шапку: получится обычный список.
list_head: "| Тикет | Название | Состояние |\n|---|---|---|"
item: "| {ticket} | {title} | {where} |"
board_unwatched: "Ни один триггер не включён, поэтому за трекером никто не следит."
board_other: "**Ещё не закончено:**"
# Тикеты, в последнем отчёте которых есть вопросы к тебе, а ответ ещё не записан.
board_asks: "**Ждут твоего ответа:**"
where_asks: "{step}: вопросов {count}, [отчёт]({link})"
board_read: "---\n\n_Трекер прочитан {time}; слежение {watching}._"
board_never: "---\n\n_Трекер ещё не читался; слежение {watching}._"
watching_running: "работает"
watching_stopped: "не работает"
watching_paused: "на паузе с {time}"

# Один тикет целиком: agent-projects board <проект> <тикет>, и новость о готовом отчёте.
# Первая строка: тикет, что случилось и нужен ли ты. Вторая: название и PR, если он есть.
card_head: "**{ticket} · {where}**"
card_head_needs: "**{ticket} · {where} · ждёт твоих ответов: {count}**"
card_title_pr: "{title} · [PR #{number}]({url})"
# Чем соединяются части последней строки: отчёт, предложения, как открыть чат агента.
card_join: " · "
card_outcome: "**Итог:** {text}"
card_needs: "**Нужно от тебя:**"
card_no_needs: "От тебя ничего не нужно."
card_report: "Отчёт: [{name}]({link})"
card_suggestions: "предложений: {count}"
# Снимки и видео, которые называет отчёт: каждый ссылкой.
card_files: "**Снимки из отчёта:** {files}"
card_failed: "**Причина:** {note}"
card_again: "_Напиши «запусти {ticket} ещё раз», чтобы повторить._"
card_last: "**Последнее сообщение запуска:** [{name}]({link})"
card_earlier: "**Предыдущий отчёт:** [{name}]({link})"
card_open: "«открой {ticket}», чтобы поговорить с агентом"
card_none: "По {ticket} на этой машине записей нет."

# Новости проекта: agent-projects news <проект>.
news_none: "Ничего нового."
# Линия перед новостями, между ними и после: каждая новость стоит отдельно.
news_rule: "---"
news_started: "{line}\n{title}\nЗапустил триггер «{trigger}»."
news_sorted: "{line}\n{title}\nТак решила проверка триггера «{trigger}»."
where_nothing_to_start: "проверка триггера «{trigger}» решила, что запускать нечего ({outcome})"
burst: "В очереди {count} новых событий, а одновременно идёт не больше {limit}. Скажи, какие снять, если они не нужны."
# Тикеты пришли под триггер или ушли из-под него: шапка с триггером и числами, под ней
# таблица только с этими тикетами. {counts} собирается из текстов ниже через changed_join;
# для одного тикета у каждого свой текст.
changed_head: "**Триггер `{trigger}` · {counts}**"
changed_join: ", "
changed_new_one: "1 новый"
changed_new: "{count} новых"
changed_closed_one: "1 закрыт"
changed_closed: "{count} закрыто"
changed_moved_one: "1 ушёл"
changed_moved: "{count} ушло"
changed_list_head: "| Тикет | Название | Что случилось | Состояние |\n|---|---|---|---|"
changed_item: "| {ticket} | {title} | {what} | {where} |"
changed_what_new: "новый"
changed_what_closed: "закрыт ({status})"
changed_what_moved: "теперь {status}, на {assignee}"
# Сводка за день начинается с того, что это и нужен ли ты.
summary_head: "**{project} · сводка за день · ждут твоего ответа: {asks}**"
summary_finished: "- **Готово:** {ticket}, {step}"
summary_failed: "- **Ошибка:** {ticket}, {step}: {note}"
summary_held: "- **Ждут твоего слова:** {tickets}"
summary_going: "- идёт сейчас: {running}; в очереди: {queued}"
summary_skipped: "- пропущено или разобрано как шум: {count}"
summary_cost: "- стоимость законченных запусков: ${cost}"

# Строка, которой команда отвечает в поле say.
asked: "{line}, на {model}, {effort}. Итог придёт сюда."
asked_sorting: "{line}. Что она запустит, напишу сюда."
trigger_now_on: "Триггер «{trigger}» включён."
trigger_now_off: "Триггер «{trigger}» выключен."
held_head: "**Под триггер уже подходят эти тикеты, сами они не запустились:**"
held_ask: "**Какие из них запустить?**"
paused: "Слежение на паузе. Запусков, которые ещё идут и доработают: {running}."
resumed: "Слежение снова работает."
not_paused: "Слежение не было на паузе."
opened: "Чат в сайдбаре: «{chat}». Его первый ответ стоит дороже обычного: он заново читает всю переписку."
opened_already: "Чат уже открыт: «{chat}»."
queued: "В очередь: {tickets}."
dismissed: "Снято: {tickets}."

# Одна строка уведомления на телефон. Про тикет это строка notify_ticket; {line} здесь она же.
notify_needs: "{line}, нужен твой ответ"
notify_changed: "Триггер {trigger}: {counts}"
notify_summary: "Сводка за день по {project} в чате"
