# Reviews that wait for the current user, and what happens to a review afterwards.
# Format and rules: skills/project-master/references/triggers.md.
name: my review
# Words for the developer, shown as they are: the trigger in one line, and the heading
# over the tickets that are under it. A run's `label` is how its step is called; a
# run that starts a skill is called by the skill's words in ../messages.yaml.
about: "Тикет перевели в In Review на тебя, и это сделал не ты: запускает ревью. Новые комментарии к таким тикетам разбирает проверка"
heading: В ревью сейчас
on_any:
  - source: linear
    event: status_changed
    to: In Review
    assignee: current_user
    actor: not_current_user
    skip: ticket_taken_in_current_env   # a chat here already works on it
    then: review
  - source: linear
    event: comment_added
    ticket: reviewed_in_current_env     # a review of it is on record here
    skip: agent_comment
  - source: github
    event: pr_review_or_comment
    ticket: reviewed_in_current_env
    skip: agent_comment
check:
  model: haiku
  effort: low
  prompt: |
    Read the comment, the ticket's record on this machine, and the last review
    report. Answer with exactly one outcome:
    - own_review: the current user wrote review remarks themself;
    - author_answered: the author replied to review points, or says the fixes
      are pushed;
    - noise: thanks, status chatter, bots, agent reports.
run:
  review:
    command: /review-task {ticket}
    model: opus
    effort: high
  own_review:
    prompt: |
      Add the current user's remarks to the ticket's record, so that the next
      review run takes them into account. Start nothing.
    label: запись твоих замечаний
    model: haiku
    effort: low
    quiet: true                         # only a record; the project chat is not told
  author_answered:
    prompt: |
      Report which review points the author closed, which stay open, and the
      command that reviews the change again. Start nothing.
    label: разбор ответа автора
    model: sonnet
    effort: medium
  noise: skip
